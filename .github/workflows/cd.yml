name: CD

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-pipeline
  cancel-in-progress: false

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ vars.AWS_DEPLOY_ENABLED == 'true' }}

    steps:
      - name: Configure AWS credentials
        # aws-actions/configure-aws-credentials v4
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Verify voclabs session role
        run: |
          CALLER_ARN=$(aws sts get-caller-identity --query Arn --output text 2>&1 || true)
          echo "Caller identity: ${CALLER_ARN}"
          if [[ "${CALLER_ARN}" != *":assumed-role/voclabs/"* ]]; then
            echo "::error::AWS session token is expired or does not belong to the voclabs role."
            echo "Please update AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, and AWS_SESSION_TOKEN in GitHub Secrets."
            exit 1
          fi
          echo "AWS session validated successfully."

  quality-gate:
    name: Quality gate
    needs: guard
    uses: ./.github/workflows/ci.yml

  infra:
    name: Infrastructure
    needs: quality-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      cluster_name: ${{ steps.tf_outputs.outputs.cluster_name }}
      ecr_repository_url: ${{ steps.tf_outputs.outputs.ecr_repository_url }}
      db_endpoint: ${{ steps.tf_outputs.outputs.db_endpoint }}
      region: ${{ steps.tf_outputs.outputs.region }}

    steps:
      - name: Check out repository
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        # aws-actions/configure-aws-credentials v4
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Set up Terraform
        # hashicorp/setup-terraform v3
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.16.6"

      - name: Initialize and apply Terraform stack
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          terraform -chdir=infra init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}"
          terraform -chdir=infra apply -auto-approve -input=false

      - name: Extract Terraform outputs
        id: tf_outputs
        run: |
          echo "cluster_name=$(terraform -chdir=infra output -raw cluster_name)" >> "$GITHUB_OUTPUT"
          echo "ecr_repository_url=$(terraform -chdir=infra output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "db_endpoint=$(terraform -chdir=infra output -raw db_endpoint)" >> "$GITHUB_OUTPUT"
          echo "region=$(terraform -chdir=infra output -raw region)" >> "$GITHUB_OUTPUT"

  image:
    name: Build and Push Image
    needs: infra
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v3
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Configure AWS credentials
        # aws-actions/configure-aws-credentials v4
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Log in to Amazon ECR
        # aws-actions/amazon-ecr-login v2
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd

      - name: Build and push container image
        # docker/build-push-action v6
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          tags: ${{ needs.infra.outputs.ecr_repository_url }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EKS
    needs:
      - infra
      - image
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        # aws-actions/configure-aws-credentials v4
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Execute AWS deploy script
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          CLUSTER_NAME: ${{ needs.infra.outputs.cluster_name }}
          IMAGE: ${{ needs.infra.outputs.ecr_repository_url }}:${{ github.sha }}
          DB_ENDPOINT: ${{ needs.infra.outputs.db_endpoint }}
          DB_USERNAME: workshop_app
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          APP_SECURITY_JWT_SECRET: ${{ secrets.APP_SECURITY_JWT_SECRET }}
          APP_SECURITY_ESTIMATE_GATEWAY_HMAC_SECRET: ${{ secrets.APP_SECURITY_ESTIMATE_GATEWAY_HMAC_SECRET }}
          ALLOWED_CIDRS: ${{ vars.ALLOWED_CIDRS || '' }}
        run: bash scripts/k8s/aws-deploy.sh
