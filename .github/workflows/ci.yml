name: CI

on:
  workflow_call:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  infra-lint:
    name: Infra lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Terraform
        # hashicorp/setup-terraform v3
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.16.6"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra

      - name: Validate Terraform bootstrap configuration
        run: |
          terraform -chdir=infra/bootstrap init -backend=false
          terraform -chdir=infra/bootstrap validate

      - name: Validate Terraform stack configuration
        run: |
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate

      - name: Validate Kubernetes manifests with kubeconform
        run: |
          kubectl kustomize k8s/overlays/local | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary
          kubectl kustomize k8s/overlays/aws | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Java 21
        # actions/setup-java v5.6.0
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Run quality gate
        run: ./mvnw clean verify

      - name: Upload test reports
        if: ${{ always() }}
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 30

      - name: Upload JaCoCo report
        if: ${{ always() }}
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: jacoco-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/site/jacoco/**
          if-no-files-found: error
          retention-days: 30
