spring.application.name=workshop-management-system

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/workshop_management_system}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=BINARY
spring.jpa.properties.hibernate.default_batch_fetch_size=25

spring.flyway.enabled=true
app.seed.enabled=false

app.supplier.base-url=${SUPPLIER_BASE_URL:http://localhost:8089}
app.supplier.connect-timeout=${SUPPLIER_CONNECT_TIMEOUT:2s}
app.supplier.read-timeout=${SUPPLIER_READ_TIMEOUT:5s}
app.supplier.api-key=${SUPPLIER_API_KEY:}
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:local-development-only-default-secret-please-rotate-in-any-real-deployment}
app.security.estimate-gateway.hmac-secret=${APP_SECURITY_ESTIMATE_GATEWAY_HMAC_SECRET:local-development-only-estimate-gateway-secret-please-rotate}
app.security.estimate-gateway.timestamp-tolerance-seconds=${APP_SECURITY_ESTIMATE_GATEWAY_TIMESTAMP_TOLERANCE_SECONDS:300}
app.security.estimate-gateway.max-body-bytes=${APP_SECURITY_ESTIMATE_GATEWAY_MAX_BODY_BYTES:65536}

# RF52 - customer e-mail notifications. "log" (default) keeps the simulated log-only adapters; "smtp" sends real
# e-mails through spring.mail.*. spring.mail.host/port/username/password are intentionally not declared here: they
# come only from the environment (SPRING_MAIL_HOST, ...; ConfigMap/Secret in K8s), so no credential ever has a
# versioned default and no mail sender is created unless a host is actually configured.
app.notification.email.channel=${APP_NOTIFICATION_EMAIL_CHANNEL:log}
app.notification.email.from=${APP_NOTIFICATION_EMAIL_FROM:no-reply@workshop.local}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

springdoc.swagger-ui.path=/swagger-ui.html
