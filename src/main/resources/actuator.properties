# Health probes (infra technical-spec D3). Imported by both src/main and src/test application.properties, so the
# automated tests exercise exactly this configuration instead of a copy that could drift from it.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
# Public, unauthenticated endpoints: only the aggregated status is returned, never components or details.
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# Liveness stays internal-only (no db): a database outage must remove the pod from the Service, not restart it.
management.endpoint.health.group.readiness.include=readinessState,db
# The test SMTP being down must not take the API out of the Service: e-mail is a side effect (ADR-004).
management.health.mail.enabled=false
