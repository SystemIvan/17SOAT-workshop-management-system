spring.datasource.url=jdbc:h2:mem:workshop_management_system;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=BINARY
spring.jpa.properties.hibernate.default_batch_fetch_size=25
spring.jpa.open-in-view=false
spring.flyway.enabled=true
app.seed.enabled=false
app.supplier.base-url=http://localhost:8089
app.supplier.connect-timeout=2s
app.supplier.read-timeout=5s
app.supplier.api-key=
app.security.jwt.secret=test-only-secret-not-used-outside-the-automated-test-suite
app.security.estimate-gateway.hmac-secret=test-only-estimate-gateway-secret-not-used-outside-the-test-suite

# Health block duplicated from src/main/resources/application.properties, which this file shadows on the
# test classpath; keep both identical. The management port is left unset here (same port, MockMvc-friendly);
# ContainerProbesIntegrationTest runs the separate management port explicitly.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
