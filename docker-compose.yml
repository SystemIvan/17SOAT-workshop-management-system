services:
  # Mailpit — local e-mail testing for RF52 notifications
  mailpit:
    image: axllent/mailpit:v1.31.4
    container_name: workshop-mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - workshop-network
    restart: unless-stopped

  supplier-simulator:
    image: wiremock/wiremock:3.13.1
    container_name: workshop-supplier-simulator
    command: ["--global-response-templating"]
    ports:
      - "${SUPPLIER_SIMULATOR_PORT:-8089}:8080"
    volumes:
      - ./docker/wiremock:/home/wiremock:ro
    networks:
      - workshop-network
    restart: unless-stopped

  # MySQL Database
  mysql:
    image: mysql:8.4
    container_name: workshop-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-workshop}
      MYSQL_USER: ${DB_USERNAME:-workshop_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-workshop_pass}
      TZ: 'America/Sao_Paulo'
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      # Persistência de dados
      - mysql_data:/var/lib/mysql
      # Script de inicialização (opcional)
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - workshop-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME:-workshop_user}", "-p${DB_PASSWORD:-workshop_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # Spring Boot Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workshop-app
    environment:
      # Same DB_* contract used by the Kubernetes ConfigMap/Secret (technical-spec D1).
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-workshop}?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-workshop_user}
      DB_PASSWORD: ${DB_PASSWORD:-workshop_pass}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
      SUPPLIER_BASE_URL: http://supplier-simulator:8080
      SUPPLIER_CONNECT_TIMEOUT: ${SUPPLIER_CONNECT_TIMEOUT:-2s}
      SUPPLIER_READ_TIMEOUT: ${SUPPLIER_READ_TIMEOUT:-5s}
      SUPPLIER_API_KEY: ${SUPPLIER_API_KEY:-}
      APP_SECURITY_JWT_SECRET: ${APP_SECURITY_JWT_SECRET:-change-me-to-a-random-secret-with-at-least-32-bytes}
      APP_SECURITY_ESTIMATE_GATEWAY_HMAC_SECRET: ${APP_SECURITY_ESTIMATE_GATEWAY_HMAC_SECRET:-local-development-only-estimate-gateway-secret-please-rotate}
      APP_NOTIFICATION_EMAIL_CHANNEL: ${APP_NOTIFICATION_EMAIL_CHANNEL:-smtp}
      APP_NOTIFICATION_EMAIL_FROM: ${APP_NOTIFICATION_EMAIL_FROM:-no-reply@workshop.local}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mailpit}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      SERVER_PORT: 8080
      TZ: 'America/Sao_Paulo'
    ports:
      - "${APP_PORT:-8080}:8080"
    # Same readiness endpoint the Kubernetes readinessProbe uses; curl already ships with the base image.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s
    depends_on:
      mysql:
        condition: service_healthy
      supplier-simulator:
        condition: service_started
      mailpit:
        condition: service_started
    networks:
      - workshop-network
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  mysql_data:
    driver: local

networks:
  workshop-network:
    driver: bridge
