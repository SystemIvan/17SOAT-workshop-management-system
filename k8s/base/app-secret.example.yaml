# Template only: NOT part of kustomization.yaml and never applied with real values. scripts/k8s/local-up.sh (kind) and
# scripts/k8s/aws-deploy.sh (AWS) create this Secret from environment values with
# `kubectl create secret generic ... --dry-run=client -o yaml | kubectl apply -f -`.
apiVersion: v1
kind: Secret
metadata:
  name: workshop-app-secrets
  namespace: workshop
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: jdbc:mysql://<host>:3306/workshop?serverTimezone=America/Sao_Paulo
  SPRING_DATASOURCE_USERNAME: <user>
  SPRING_DATASOURCE_PASSWORD: <password>
  APP_SECURITY_JWT_SECRET: <random secret, at least 32 bytes>
  APP_SECURITY_ESTIMATE_GATEWAY_HMAC_SECRET: <secret shared with the external estimate gateway>
