apiVersion: v1
kind: ConfigMap
metadata:
  name: workshop-app-config
  labels:
    app.kubernetes.io/name: workshop-app
    app.kubernetes.io/part-of: workshop-management-system
# Non-sensitive settings, same variable names as docker-compose.yml. Credentials and the datasource URL live in the
# workshop-app-secrets Secret; the overlays add SPRING_PROFILES_ACTIVE and APP_SEED_ENABLED.
data:
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
  SUPPLIER_BASE_URL: http://supplier-simulator:8080
  SUPPLIER_CONNECT_TIMEOUT: 2s
  SUPPLIER_READ_TIMEOUT: 5s
  # Customer e-mails are only logged in the cluster: Mailpit is a local-only tool.
  APP_NOTIFICATION_EMAIL_CHANNEL: log
  APP_NOTIFICATION_EMAIL_FROM: no-reply@workshop.local
  # 60% of the 1Gi limit leaves ~400Mi for metaspace, threads and code cache outside the heap.
  JAVA_OPTS: -XX:MaxRAMPercentage=60.0
  TZ: America/Sao_Paulo
  # With the database down, readiness only answers after the Hikari connection timeout (30 s by default); 5 s keeps
  # management threads from piling up behind the probes.
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "5000"
