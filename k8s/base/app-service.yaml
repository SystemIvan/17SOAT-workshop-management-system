apiVersion: v1
kind: Service
metadata:
  name: workshop-app
  labels:
    app.kubernetes.io/name: workshop-app
    app.kubernetes.io/part-of: workshop-management-system
spec:
  # ClusterIP here; the local overlay turns it into a NodePort and the aws overlay into a LoadBalancer.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: workshop-app
  ports:
    # Business port only: the management port 8081 is deliberately left out.
    - name: http
      port: 80
      targetPort: http
