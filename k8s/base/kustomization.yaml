# Shared by every environment. Overlays (k8s/overlays/<env>) set the namespace, the image tag, how the API is
# exposed and the environment-specific configuration/secrets.
# The Namespace object is deliberately absent: the Terraform "database" stack owns it (technical-spec D5-D7).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - app-deployment.yaml
  - app-service.yaml
  - app-hpa.yaml
  - mailpit.yaml
  - supplier-simulator.yaml

# Generated (not a plain ConfigMap file) so the name gets a content hash: changing a value changes the name
# referenced by the Deployment, which triggers a rolling update instead of pods silently keeping stale values.
configMapGenerator:
  - name: workshop-app-config
    envs:
      - app-config.env
