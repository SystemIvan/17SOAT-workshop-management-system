apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared by the local (kind) and aws overlays; it is not meant to be applied on its own, because the application image
# and the Service exposure are set by the overlays. The workshop-app-secrets Secret and the supplier-simulator-mappings
# ConfigMap are created by scripts/k8s/*.sh from environment values and docker/wiremock/mappings, never versioned here.
namespace: workshop

resources:
  - namespace.yaml
  - app-configmap.yaml
  - app-deployment.yaml
  - app-service.yaml
  - app-hpa.yaml
  - supplier-simulator.yaml
