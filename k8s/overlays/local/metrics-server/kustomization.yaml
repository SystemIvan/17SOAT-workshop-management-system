apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# metrics-server for the kind cluster (the HPA needs it). On EKS it is installed as an EKS community add-on instead.
resources:
  - https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.0/components.yaml

patches:
  # kind's kubelets serve self-signed certificates.
  - target:
      kind: Deployment
      name: metrics-server
      namespace: kube-system
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-insecure-tls
